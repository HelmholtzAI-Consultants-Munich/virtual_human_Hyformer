[project]
name = "hyformer_v2"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2.0", "torchvision>=0.17.0", "numpy", "pandas", "tqdm",
                "scikit-learn", "scipy", "einops>=0.7", "huggingface_hub", "requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyformer_v2"]
